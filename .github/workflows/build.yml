name: Build and Release

on:
  push:
    branches: [ "implement-port-mode-two-click-2472215011948650659" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore "HiSuite Proxy.sln"

    - name: Build
      run: msbuild "HiSuite Proxy.sln" /p:Configuration=Release

    - name: Create Zip
      run: |
        powershell Compress-Archive -Path "HiSuite Proxy\bin\Release\*" -DestinationPath "HiSuite-Proxy-Release.zip"

    - name: Upload to Gofile
      id: upload_gofile
      shell: bash
      run: |
        SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
        RESPONSE=$(curl -F "file=@HiSuite-Proxy-Release.zip" https://${SERVER}.gofile.io/contents/uploadfile)
        URL=$(echo $RESPONSE | jq -r '.data.downloadPage')
        echo "DOWNLOAD_URL=$URL" >> $GITHUB_OUTPUT
        echo "### HiSuite Proxy Build Artifact" >> $GITHUB_STEP_SUMMARY
        echo "Download Link: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HiSuite-Proxy-Release
        path: HiSuite-Proxy-Release.zip
